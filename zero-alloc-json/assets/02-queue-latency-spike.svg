<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Влияние паузы GC на длину очереди и хвост задержки</title>
  <desc id="desc">Иллюстрация эффекта рассасывания очереди: пауза GC на 4 миллисекунды накапливает 200 сообщений, что растягивает период повышенной задержки обработки на 20 миллисекунд.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="340" rx="14" fill="#0f172a"/>

  <!-- Top Title Bar -->
  <text x="36" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">МАТЕМАТИКА ОЧЕРЕДИ: ПОЧЕМУ ПАУЗА GC НА 4 МС ВЫЗЫВАЕТ ХВОСТ ЗАДЕРЖКИ В 20 МС</text>

  <!-- Stage 1: GC Pause -->
  <g transform="translate(36, 56)">
    <rect width="276" height="196" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="276" height="32" rx="10" fill="#450a0a"/>
    <text x="16" y="21" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">1. ПАУЗА GC: t = 0..4 мс (4 мс)</text>

    <text x="16" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Входной поток:</text>
    <text x="16" y="74" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12" font-weight="700">50 000 сообщ/с (50 сообщ/мс)</text>

    <text x="16" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Поток разбора:</text>
    <text x="16" y="122" fill="#ef4444" font-family="ui-monospace, monospace" font-size="12" font-weight="700">0 сообщ/с (Stop-The-World)</text>

    <!-- Queue box -->
    <rect x="16" y="140" width="244" height="42" rx="6" fill="#2d1519" stroke="#ef4444" stroke-width="1"/>
    <text x="26" y="160" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">В очереди сокета:</text>
    <text x="26" y="174" fill="#fee2e2" font-family="ui-monospace, monospace" font-size="12">+200 сообщений скопилось</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 322 154 L 348 154" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Recovery In Progress -->
  <g transform="translate(358, 56)">
    <rect width="276" height="196" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="276" height="32" rx="10" fill="#451a03"/>
    <text x="16" y="21" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">2. РАССАСЫВАНИЕ: t = 4..24 мс</text>

    <text x="16" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Скорость разбора:</text>
    <text x="16" y="74" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12" font-weight="700">60 000 сообщ/с (60 сообщ/мс)</text>

    <text x="16" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Дельта ликвидации пробки:</text>
    <text x="16" y="122" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="12" font-weight="700">60 - 50 = 10 сообщ/мс</text>

    <!-- Queue box -->
    <rect x="16" y="140" width="244" height="42" rx="6" fill="#291e0a" stroke="#f59e0b" stroke-width="1"/>
    <text x="26" y="160" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Время ликвидации 200 пакетов:</text>
    <text x="26" y="174" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="12">200 / 10 = 20 миллисекунд</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 644 154 L 670 154" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Normal State -->
  <g transform="translate(680, 56)">
    <rect width="244" height="196" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="244" height="32" rx="10" fill="#064e3b"/>
    <text x="16" y="21" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">3. НОРМА: t = 24 мс+</text>

    <text x="16" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Состояние очереди:</text>
    <text x="16" y="74" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12" font-weight="700">0 сообщений (чисто)</text>

    <text x="16" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Текущая задержка:</text>
    <text x="16" y="122" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">&lt; 1 миллисекунды</text>

    <!-- Result box -->
    <rect x="16" y="140" width="212" height="42" rx="6" fill="#062e22" stroke="#10b981" stroke-width="1"/>
    <text x="24" y="166" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Задержка p99 в норме</text>
  </g>

  <!-- Bottom Summary Timeline -->
  <g transform="translate(36, 268)">
    <rect width="888" height="48" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1"/>
    <!-- GC bar -->
    <rect x="12" y="10" width="144" height="28" rx="5" fill="#ef4444" fill-opacity="0.8"/>
    <text x="24" y="29" fill="#fee2e2" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Пауза GC: 4 мс</text>

    <!-- Recovery bar -->
    <rect x="162" y="10" width="460" height="28" rx="5" fill="#f59e0b" fill-opacity="0.8"/>
    <text x="174" y="29" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Период повышенной задержки очереди (Recovery Time): 20 мс</text>

    <!-- Total label -->
    <text x="640" y="29" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Суммарный всплеск latency: ~24 мс</text>
  </g>
</svg>
