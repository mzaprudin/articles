<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">Влияние паузы GC на длину очереди и хвост задержки</title>
  <desc id="desc">Иллюстрация эффекта рассасывания очереди: за 4 мс паузы GC накапливается 200 сообщений, нормальный режим восстанавливается через 20 мс.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="370" rx="14" fill="#0f172a"/>

  <!-- Top Title Bar -->
  <text x="36" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.3">ОЧЕРЕДЬ СООБЩЕНИЙ ВО ВРЕМЯ ПАУЗЫ GC И ПОСЛЕ НЕЁ</text>

  <!-- Stage 1: GC Pause -->
  <g transform="translate(36, 60)">
    <rect width="276" height="216" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="276" height="36" rx="10" fill="#450a0a"/>
    <text x="16" y="24" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">1. ПАУЗА GC: t = 0..4 мс (4 мс)</text>

    <text x="16" y="60" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Входной поток:</text>
    <text x="16" y="80" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">50 000 сообщ/с (50 /мс)</text>

    <text x="16" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Поток разбора:</text>
    <text x="16" y="132" fill="#ef4444" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">0 сообщ/с (Stop-The-World)</text>

    <!-- Queue box -->
    <rect x="14" y="152" width="248" height="48" rx="6" fill="#2d1519" stroke="#ef4444" stroke-width="1"/>
    <text x="24" y="172" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">В очереди:</text>
    <text x="24" y="190" fill="#fee2e2" font-family="ui-monospace, monospace" font-size="13" font-weight="600">+200 сообщений скопилось</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 322 168 L 348 168" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Recovery In Progress -->
  <g transform="translate(358, 60)">
    <rect width="276" height="216" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="276" height="36" rx="10" fill="#451a03"/>
    <text x="16" y="24" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">2. РАССАСЫВАНИЕ: t = 4..24 мс</text>

    <text x="16" y="60" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Скорость разбора:</text>
    <text x="16" y="80" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">60 000 сообщ/с (60 /мс)</text>

    <text x="16" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Дельта ликвидации пробки:</text>
    <text x="16" y="132" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">60 - 50 = 10 сообщ/мс</text>

    <!-- Queue box -->
    <rect x="14" y="152" width="248" height="48" rx="6" fill="#291e0a" stroke="#f59e0b" stroke-width="1"/>
    <text x="24" y="172" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Время опустошения:</text>
    <text x="24" y="190" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="13" font-weight="600">200 / 10 = 20 миллисекунд</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 644 168 L 670 168" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Normal State -->
  <g transform="translate(680, 60)">
    <rect width="244" height="216" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="244" height="36" rx="10" fill="#064e3b"/>
    <text x="16" y="24" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">3. НОРМАЛЬНЫЙ РЕЖИМ</text>

    <text x="16" y="60" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Состояние очереди:</text>
    <text x="16" y="80" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">0 сообщений</text>

    <text x="16" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Ожидание в очереди:</text>
    <text x="16" y="132" fill="#34d399" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">0 мс в этой модели</text>

    <!-- Result box -->
    <rect x="14" y="152" width="216" height="48" rx="6" fill="#062e22" stroke="#10b981" stroke-width="1"/>
    <text x="24" y="181" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Очередь ликвидирована</text>
  </g>

  <!-- Bottom Summary Timeline -->
  <g transform="translate(36, 296)">
    <rect width="888" height="52" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1"/>
    <!-- GC bar -->
    <rect x="12" y="11" width="134" height="30" rx="5" fill="#ef4444" fill-opacity="0.85"/>
    <text x="22" y="31" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Пауза GC: 4 мс</text>

    <!-- Recovery bar -->
    <rect x="154" y="11" width="430" height="30" rx="5" fill="#f59e0b" fill-opacity="0.85"/>
    <text x="166" y="31" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Опустошение очереди: 20 мс</text>

    <!-- Total label -->
    <text x="600" y="31" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Нормальный режим с 24-й мс</text>
  </g>
</svg>