<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Жизненный цикл слотов FastList</title>
  <desc id="desc">Схема работы FastList: предварительное выделение объектов в массиве, сброс счётчика без зануления ссылок и повторное использование инстансов при разборе новых сообщений.</desc>

  <defs>
    <!-- Symmetrical crisp downward arrowhead -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="14" fill="#0f172a"/>

  <!-- Step 1: Preallocation -->
  <g transform="translate(36, 24)">
    <rect width="888" height="96" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="20" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">ШАГ 1. Инициализация: FastList(capacity: 4)</text>
    <text x="868" y="24" text-anchor="end" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">Count = 0 (все слоты свободны)</text>

    <!-- 4 Slots -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="202" height="44" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="101" y="27" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13.5">Слот 0: [Экземпляр #1]</text>

      <rect x="214" y="0" width="202" height="44" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="315" y="27" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13.5">Слот 1: [Экземпляр #2]</text>

      <rect x="428" y="0" width="202" height="44" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="529" y="27" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13.5">Слот 2: [Экземпляр #3]</text>

      <rect x="642" y="0" width="202" height="44" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="743" y="27" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13.5">Слот 3: [Экземпляр #4]</text>
    </g>
  </g>

  <!-- Arrow 1 to 2: Straight vertical from y=122 to y=144 -->
  <line x1="480" y1="122" x2="480" y2="144" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-down)"/>

  <!-- Step 2: First Update (Count = 2) -->
  <g transform="translate(36, 150)">
    <rect width="888" height="96" rx="8" fill="#13231c" stroke="#164e39" stroke-width="1.2"/>
    <text x="20" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">ШАГ 2. Сообщение 1: пришло 2 уровня стакана</text>
    <text x="868" y="24" text-anchor="end" fill="#34d399" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">Count = 2 (слоты 0 и 1 активны)</text>

    <!-- 4 Slots -->
    <g transform="translate(20, 36)">
      <!-- Active 0 -->
      <rect x="0" y="0" width="202" height="44" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="101" y="27" text-anchor="middle" fill="#ecfdf5" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">Слот 0: [61000, 0.5]</text>

      <!-- Active 1 -->
      <rect x="214" y="0" width="202" height="44" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="315" y="27" text-anchor="middle" fill="#ecfdf5" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">Слот 1: [60990, 1.2]</text>

      <!-- Reserved 2 -->
      <rect x="428" y="0" width="202" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
      <text x="529" y="27" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">Слот 2: [в резерве]</text>

      <!-- Reserved 3 -->
      <rect x="642" y="0" width="202" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
      <text x="743" y="27" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">Слот 3: [в резерве]</text>
    </g>
  </g>

  <!-- Arrow 2 to 3: Straight vertical from y=248 to y=270 -->
  <line x1="480" y1="248" x2="480" y2="270" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-down)"/>

  <!-- Step 3: Clear Operation -->
  <g transform="translate(36, 276)">
    <rect width="888" height="96" rx="8" fill="#1e1e2e" stroke="#6366f1" stroke-width="1.2"/>
    <text x="20" y="24" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">ШАГ 3. FastList.Clear() - сброс только логического счётчика</text>
    <text x="868" y="24" text-anchor="end" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">Count = 0 (ссылки не зануляются!)</text>

    <!-- 4 Slots -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="202" height="44" rx="6" fill="#252538" stroke="#6366f1" stroke-width="1"/>
      <text x="101" y="27" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13.5" font-weight="600">Слот 0: [объект сохранён]</text>

      <rect x="214" y="0" width="202" height="44" rx="6" fill="#252538" stroke="#6366f1" stroke-width="1"/>
      <text x="315" y="27" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13.5" font-weight="600">Слот 1: [объект сохранён]</text>

      <rect x="428" y="0" width="202" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
      <text x="529" y="27" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">Слот 2: [в резерве]</text>

      <rect x="642" y="0" width="202" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
      <text x="743" y="27" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">Слот 3: [в резерве]</text>
    </g>
  </g>

  <!-- Arrow 3 to 4: Straight vertical from y=374 to y=396 -->
  <line x1="480" y1="374" x2="480" y2="396" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-down)"/>

  <!-- Step 4: Next Update (Count = 1) -->
  <g transform="translate(36, 402)">
    <rect width="888" height="96" rx="8" fill="#13231c" stroke="#164e39" stroke-width="1.2"/>
    <text x="20" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">ШАГ 4. Сообщение 2: пришёл 1 уровень стакана</text>
    <text x="868" y="24" text-anchor="end" fill="#34d399" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">Count = 1 (Слот 0 перезаписан, 0 B/op)</text>

    <!-- 4 Slots -->
    <g transform="translate(20, 36)">
      <!-- Active 0 -->
      <rect x="0" y="0" width="202" height="44" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="101" y="27" text-anchor="middle" fill="#ecfdf5" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700">Слот 0: [61050, 0.8]</text>

      <!-- Reused object in slot 1, hidden by count -->
      <rect x="214" y="0" width="202" height="44" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="315" y="27" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13">Слот 1: [сохранён / резерв]</text>

      <!-- Reserved 2 -->
      <rect x="428" y="0" width="202" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
      <text x="529" y="27" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">Слот 2: [в резерве]</text>

      <rect x="642" y="0" width="202" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
      <text x="743" y="27" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">Слот 3: [в резерве]</text>
    </g>
  </g>
</svg>