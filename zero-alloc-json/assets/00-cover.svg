<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">0 B/op и на 34% быстрее System.Text.Json: парсинг JSON в существующие объекты в .NET</title>
  <desc id="desc">Обложка статьи: Zero-allocation JSON-парсер JsonPopulator для высоконагруженных криптобиржевых систем на .NET.</desc>
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="40%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-emerald" cx="20%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="80%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-bottom" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="text-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="card-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-stroke-active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>

  <!-- Glowing Orbs -->
  <rect width="1920" height="1080" fill="url(#glow-emerald)"/>
  <rect width="1920" height="1080" fill="url(#glow-cyan)"/>
  <rect width="1920" height="1080" fill="url(#glow-bottom)"/>

  <!-- Dot Grid Pattern -->
  <rect width="1920" height="1080" fill="url(#dot-grid)"/>

  <!-- Decorative Candlesticks and Depth Silhouette (Fintech Motif) -->
  <g opacity="0.15" transform="translate(1300, 100)">
    <!-- Candlestick chart watermark -->
    <line x1="80" y1="60" x2="80" y2="280" stroke="#10b981" stroke-width="2"/>
    <rect x="68" y="100" width="24" height="120" rx="3" fill="#10b981"/>
    
    <line x1="140" y1="40" x2="140" y2="310" stroke="#10b981" stroke-width="2"/>
    <rect x="128" y="70" width="24" height="170" rx="3" fill="#10b981"/>
    
    <line x1="200" y1="90" x2="200" y2="340" stroke="#f43f5e" stroke-width="2"/>
    <rect x="188" y="130" width="24" height="140" rx="3" fill="#f43f5e"/>
    
    <line x1="260" y1="50" x2="260" y2="290" stroke="#10b981" stroke-width="2"/>
    <rect x="248" y="90" width="24" height="150" rx="3" fill="#10b981"/>

    <line x1="320" y1="30" x2="320" y2="360" stroke="#10b981" stroke-width="2"/>
    <rect x="308" y="60" width="24" height="210" rx="3" fill="#10b981"/>

    <line x1="380" y1="110" x2="380" y2="380" stroke="#10b981" stroke-width="2"/>
    <rect x="368" y="140" width="24" height="160" rx="3" fill="#10b981"/>

    <!-- Order Book Depth Mountain Curve -->
    <path d="M 0 380 L 120 350 L 220 300 L 300 240 L 380 180 L 460 90 L 520 20 L 520 420 L 0 420 Z" fill="#10b981" fill-opacity="0.35"/>
  </g>

  <!-- Content Container (120px margins) -->
  <g transform="translate(120, 100)">
    
    <!-- Badges Row -->
    <g transform="translate(0, 0)">
      <!-- Badge 1: .NET 10 & C# -->
      <rect x="0" y="0" width="130" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
      <text x="65" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">.NET 10 / C#</text>

      <!-- Badge 2: HIGH PERFORMANCE -->
      <rect x="146" y="0" width="210" height="38" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.2"/>
      <text x="251" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.5">HIGH PERFORMANCE</text>

      <!-- Badge 3: ZERO ALLOCATION -->
      <rect x="372" y="0" width="190" height="38" rx="8" fill="#13231c" stroke="#10b981" stroke-width="1.2"/>
      <text x="467" y="24" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.5">ZERO-ALLOCATION</text>

      <!-- Badge 4: FINTECH & CRYPTO -->
      <rect x="578" y="0" width="250" height="38" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2"/>
      <text x="703" y="24" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0.5">FINTECH MARKET DATA</text>
    </g>

    <!-- Main Headline Block -->
    <!-- Massive Metric Accent -->
    <g transform="translate(0, 175)">
      <text x="0" y="0" fill="url(#text-accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="124" font-weight="900" letter-spacing="-1.5">0 B/op</text>
      
      <!-- Subtitle Accent on same baseline -->
      <text x="440" y="-12" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800">и на 34% быстрее</text>
      <text x="440" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="700">System.Text.Json</text>
    </g>

    <!-- Article Core Theme / Subhead -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700">
        Парсинг JSON в существующие объекты в .NET
      </text>
      <text x="0" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
        Ликвидация пауз сборщика мусора (GC Stop-The-World) под непрерывным потоком биржевых данных
      </text>
    </g>

    <!-- 4 Key Metric / Architecture Cards -->
    <g transform="translate(0, 440)">
      
      <!-- Card 1: 0 B/op -->
      <g transform="translate(0, 0)">
        <rect width="395" height="210" rx="14" fill="#0b1716" stroke="url(#card-stroke-active)" stroke-width="1.8"/>
        <text x="28" y="44" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="1">АЛЛОКАЦИИ В КУЧЕ</text>
        <text x="28" y="105" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900">0 B / op</text>
        <text x="28" y="145" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Мутация объектов на месте</text>
        <text x="28" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Пул строк + FastList для коллекций</text>
      </g>

      <!-- Card 2: +34% Speed -->
      <g transform="translate(425, 0)">
        <rect width="395" height="210" rx="14" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.8"/>
        <text x="28" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ПРОИЗВОДИТЕЛЬНОСТЬ</text>
        <text x="28" y="105" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900">+34%</text>
        <text x="28" y="145" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">430 нс против 650 нс</text>
        <text x="28" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Быстрее десериализации JsonSerializer</text>
      </g>

      <!-- Card 3: 0 ms GC Pause -->
      <g transform="translate(850, 0)">
        <rect width="395" height="210" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.8"/>
        <text x="28" y="44" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ЗАДЕРЖКИ В СЕТИ</text>
        <text x="28" y="105" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900">0 ms STW</text>
        <text x="28" y="145" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Без пробок в очереди сокета</text>
        <text x="28" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Предсказуемый p99/p99.9 тайминг</text>
      </g>

      <!-- Card 4: Multi-Segment -->
      <g transform="translate(1275, 0)">
        <rect width="405" height="210" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.8"/>
        <text x="28" y="44" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="1">PIPE READER &amp; BCL</text>
        <text x="28" y="105" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900">Multi-Seg</text>
        <text x="28" y="145" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Склейка стыков буферов</text>
        <text x="28" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Обход скрытых аллокаций в рантайме</text>
      </g>

    </g>

    <!-- Footer Bar -->
    <g transform="translate(0, 750)">
      <line x1="0" y1="0" x2="1680" y2="0" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Author and Org -->
      <text x="0" y="42" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">Михаил Запрудин</text>
      <text x="180" y="42" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20">•</text>
      <text x="200" y="42" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20">Инженерная практика и Highload архитектура</text>

      <!-- Repo link on right -->
      <g transform="translate(1680, 42)">
        <text x="0" y="0" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="18" font-weight="600" text-anchor="end">github.com/mzaprudin/zero-alloc-json</text>
      </g>
    </g>

  </g>
</svg>