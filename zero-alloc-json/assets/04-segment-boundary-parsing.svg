<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Разбор токена на стыке сетевых буферов</title>
  <desc id="desc">Сравнение обработки разрезанного токена на границе двух страниц памяти: скрытая аллокация в BCL через ToArray vs копирование на стек без аллокаций в JsonPopulator.</desc>

  <!-- Background -->
  <rect width="960" height="440" rx="14" fill="#0f172a"/>

  <!-- Top Title Bar -->
  <text x="36" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.3">РАЗБОР ТОКЕНА НА СТЫКЕ СЕТЕВЫХ СЕГМЕНТОВ (ReadOnlySequence&lt;byte&gt;)</text>

  <!-- Physical Memory Layout -->
  <g transform="translate(36, 54)">
    <!-- Segment 1 -->
    <rect x="0" y="0" width="436" height="92" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="16" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">СЕГМЕНТ 1 (Память PipeReader #1)</text>

    <!-- Bytes in Segment 1 -->
    <g transform="translate(16, 38)">
      <rect x="0" y="0" width="276" height="40" rx="5" fill="#0f172a"/>
      <text x="12" y="26" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="14">...{"u":102,"s":"BTCUSDT",</text>

      <!-- Token head -->
      <rect x="284" y="0" width="120" height="40" rx="5" fill="#2d1519" stroke="#f87171" stroke-width="1.5"/>
      <text x="294" y="26" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="14" font-weight="700">"b":"610</text>
    </g>

    <!-- Boundary line and Badge -->
    <line x1="444" y1="-8" x2="444" y2="102" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4"/>
    <rect x="376" y="96" width="136" height="24" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="385" y="113" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">СТЫК БУФЕРОВ</text>

    <!-- Segment 2 -->
    <rect x="452" y="0" width="436" height="92" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="468" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">СЕГМЕНТ 2 (Память PipeReader #2)</text>

    <!-- Bytes in Segment 2 -->
    <g transform="translate(468, 38)">
      <!-- Token tail -->
      <rect x="0" y="0" width="94" height="40" rx="5" fill="#2d1519" stroke="#f87171" stroke-width="1.5"/>
      <text x="10" y="26" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="14" font-weight="700">00.20"</text>

      <rect x="102" y="0" width="302" height="40" rx="5" fill="#0f172a"/>
      <text x="114" y="26" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="14">,"a":"61000.30"}...</text>
    </g>
  </g>

  <!-- Reader detection banner (neat balanced 14px gap after "СТЫК БУФЕРОВ") -->
  <g transform="translate(36, 188)">
    <rect width="888" height="38" rx="6" fill="#1e1e2e" stroke="#6366f1" stroke-width="1.2"/>
    <text x="20" y="24" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="13.5" font-weight="600">Utf8JsonReader: токен разрезан -&gt; reader.HasValueSequence = true; (Length = 8)</text>
  </g>

  <!-- Left Branch: BCL -->
  <g transform="translate(36, 242)">
    <rect width="432" height="180" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="432" height="34" rx="10" fill="#450a0a"/>
    <text x="16" y="23" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">СТАНДАРТНЫЙ BCL (reader.GetDecimal)</text>

    <text x="16" y="56" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Внутренняя логика Utf8JsonReader в .NET 10:</text>
    <rect x="16" y="66" width="400" height="34" rx="5" fill="#0f172a"/>
    <text x="24" y="89" fill="#f87171" font-family="ui-monospace, monospace" font-size="13.5" font-weight="600">byte[] bytes = _valueSequence.ToArray();</text>

    <!-- Result -->
    <rect x="16" y="110" width="400" height="54" rx="6" fill="#2d1519" stroke="#ef4444" stroke-width="1"/>
    <text x="24" y="131" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Скрытая аллокация массива byte[] в куче</text>
    <text x="24" y="151" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">Каждое разрезанное число создаёт мусор для GC</text>
  </g>

  <!-- Right Branch: JsonPopulator -->
  <g transform="translate(492, 242)">
    <rect width="432" height="180" rx="10" fill="#13231c" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="432" height="34" rx="10" fill="#064e3b"/>
    <text x="16" y="23" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">РЕШЕНИЕ JSONPOPULATOR (Стековый буфер)</text>

    <text x="16" y="56" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Копирование среза токена в память стека:</text>
    <rect x="14" y="66" width="404" height="34" rx="5" fill="#0b1713"/>
    <text x="20" y="88" fill="#34d399" font-family="ui-monospace, monospace" font-size="12.5" font-weight="600">reader.ValueSequence.CopyTo(stackalloc byte[len]);</text>

    <!-- Result -->
    <rect x="16" y="110" width="400" height="54" rx="6" fill="#062e22" stroke="#10b981" stroke-width="1"/>
    <text x="24" y="131" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">0 B/op: Utf8Parser.TryParse по Span&lt;byte&gt;</text>
    <text x="24" y="151" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">Ни одного байта в куче независимо от стыков буфера</text>
  </g>
</svg>