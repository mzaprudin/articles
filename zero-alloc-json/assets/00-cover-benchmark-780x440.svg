<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="title desc">
  <title id="title">Сравнение производительности: System.Text.Json vs JsonPopulator</title>
  <desc id="desc">Сравнение времени разбора и аллокаций в куче между System.Text.Json и JsonPopulator на реальных данных.</desc>

  <!-- Background Base -->
  <rect width="780" height="440" rx="10" fill="#0f172a"/>
  <rect width="780" height="440" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Title -->
  <g transform="translate(24, 36)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Сравнение производительности: System.Text.Json vs JsonPopulator</text>
  </g>

  <!-- Table Container -->
  <g transform="translate(24, 58)">
    <!-- Table Header Row -->
    <rect x="0" y="0" width="732" height="36" rx="6" fill="#1e293b"/>
    <text x="16" y="23" fill="#94a3b8" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.4">СЦЕНАРИЙ</text>
    <text x="200" y="23" fill="#94a3b8" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.4">SYSTEM.TEXT.JSON</text>
    <text x="370" y="23" fill="#34d399" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.4">JSONPOPULATOR</text>
    <text x="548" y="23" fill="#38bdf8" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.4">РЕЗУЛЬТАТ</text>

    <!-- Row 1: Trade -->
    <g transform="translate(0, 48)">
      <rect width="732" height="90" rx="8" fill="#141e33" stroke="#1e293b" stroke-width="1.2"/>

      <!-- Scenario -->
      <text x="16" y="35" fill="#ffffff" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Сделка Trade</text>
      <text x="16" y="63" fill="#94a3b8" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">156 B UTF-8 • 7 полей</text>

      <!-- STJ -->
      <text x="200" y="35" fill="#cbd5e1" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" font-weight="600">521,4 нс</text>
      <text x="200" y="63" fill="#f87171" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="13" font-weight="600">120 B/op</text>

      <!-- JsonPopulator -->
      <text x="370" y="35" fill="#ffffff" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" font-weight="700">430,5 нс</text>
      <text x="370" y="63" fill="#34d399" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="13" font-weight="700">0 B/op</text>

      <!-- Result -->
      <text x="548" y="35" fill="#38bdf8" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">+21% быстрее</text>
      <text x="548" y="63" fill="#34d399" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">0 B/op (-100%)</text>
    </g>

    <!-- Row 2: Contract -->
    <g transform="translate(0, 150)">
      <rect width="732" height="90" rx="8" fill="#141e33" stroke="#1e293b" stroke-width="1.2"/>

      <!-- Scenario -->
      <text x="16" y="35" fill="#ffffff" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Контракт Gate</text>
      <text x="16" y="63" fill="#94a3b8" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">1,3 KB UTF-8 • 50 полей</text>

      <!-- STJ -->
      <text x="200" y="35" fill="#cbd5e1" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" font-weight="600">2,48 мкс</text>
      <text x="200" y="63" fill="#f87171" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="13" font-weight="600">208 B/op</text>

      <!-- JsonPopulator -->
      <text x="370" y="35" fill="#ffffff" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" font-weight="700">1,85 мкс</text>
      <text x="370" y="63" fill="#34d399" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="13" font-weight="700">0 B/op</text>

      <!-- Result -->
      <text x="548" y="35" fill="#38bdf8" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">+34% быстрее</text>
      <text x="548" y="63" fill="#34d399" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">0 B/op (-100%)</text>
    </g>

    <!-- Row 3: Array -->
    <g transform="translate(0, 252)">
      <rect width="732" height="90" rx="8" fill="#141e33" stroke="#1e293b" stroke-width="1.2"/>

      <!-- Scenario -->
      <text x="16" y="35" fill="#ffffff" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Массив контрактов</text>
      <text x="16" y="63" fill="#94a3b8" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">592 контракта • ~1 МБ JSON</text>

      <!-- STJ -->
      <text x="200" y="35" fill="#cbd5e1" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" font-weight="600">1,80 мс</text>
      <text x="200" y="63" fill="#f87171" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="13" font-weight="600">141 КБ/op</text>

      <!-- JsonPopulator -->
      <text x="370" y="35" fill="#ffffff" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" font-weight="700">1,46 мс</text>
      <text x="370" y="63" fill="#34d399" font-family="'Liberation Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="13" font-weight="700">0 B/op (FastList)</text>

      <!-- Result -->
      <text x="548" y="35" fill="#38bdf8" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">+23% быстрее</text>
      <text x="548" y="63" fill="#34d399" font-family="'Liberation Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">0 B/op (-141 КБ)</text>
    </g>

  </g>
</svg>