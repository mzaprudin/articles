<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Сравнение производительности: System.Text.Json vs JsonPopulator</title>
  <desc id="desc">Сравнение времени разбора и аллокаций в куче между System.Text.Json и JsonPopulator на реальных данных.</desc>

  <!-- Background -->
  <rect width="960" height="380" rx="12" fill="#0f172a"/>
  <rect width="960" height="380" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Title -->
  <g transform="translate(32, 34)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Сравнение производительности: System.Text.Json против JsonPopulator</text>
  </g>

  <!-- Table Container -->
  <g transform="translate(32, 58)">
    <!-- Header Row -->
    <rect x="0" y="0" width="896" height="38" rx="6" fill="#1e293b"/>
    <text x="20" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">СЦЕНАРИЙ</text>
    <text x="260" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">SYSTEM.TEXT.JSON</text>
    <text x="480" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">JSONPOPULATOR</text>
    <text x="700" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">РЕЗУЛЬТАТ</text>

    <!-- Row 1: Trade -->
    <g transform="translate(0, 48)">
      <rect width="896" height="74" rx="8" fill="#141e33" stroke="#1e293b" stroke-width="1.2"/>
      
      <!-- Scenario -->
      <text x="20" y="30" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Сделка Trade</text>
      <text x="20" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">156 байт UTF-8 • 7 полей</text>
      
      <!-- STJ -->
      <text x="260" y="30" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="15" font-weight="600">521,4 нс</text>
      <text x="260" y="54" fill="#f87171" font-family="ui-monospace, monospace" font-size="13" font-weight="600">120 B в куче</text>
      
      <!-- JsonPopulator -->
      <text x="480" y="30" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="700">430,5 нс</text>
      <text x="480" y="54" fill="#34d399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">0 B / op (0 B в куче)</text>
      
      <!-- Result -->
      <text x="700" y="30" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">на 21% быстрее</text>
      <text x="700" y="54" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">0 B аллокаций (-100%)</text>
    </g>

    <!-- Row 2: Contract -->
    <g transform="translate(0, 132)">
      <rect width="896" height="74" rx="8" fill="#141e33" stroke="#1e293b" stroke-width="1.2"/>
      
      <!-- Scenario -->
      <text x="20" y="30" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Контракт Gate</text>
      <text x="20" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">1 312 байт UTF-8 • 50 полей</text>
      
      <!-- STJ -->
      <text x="260" y="30" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="15" font-weight="600">2,48 мкс</text>
      <text x="260" y="54" fill="#f87171" font-family="ui-monospace, monospace" font-size="13" font-weight="600">208 B в куче</text>
      
      <!-- JsonPopulator -->
      <text x="480" y="30" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="700">1,85 мкс</text>
      <text x="480" y="54" fill="#34d399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">0 B / op (0 B в куче)</text>
      
      <!-- Result -->
      <text x="700" y="30" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">на 34% быстрее</text>
      <text x="700" y="54" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">0 B аллокаций (-100%)</text>
    </g>

    <!-- Row 3: Array -->
    <g transform="translate(0, 216)">
      <rect width="896" height="74" rx="8" fill="#141e33" stroke="#1e293b" stroke-width="1.2"/>
      
      <!-- Scenario -->
      <text x="20" y="30" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Массив контрактов</text>
      <text x="20" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">592 контракта • ~1 МБ JSON</text>
      
      <!-- STJ -->
      <text x="260" y="30" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="15" font-weight="600">1,80 мс</text>
      <text x="260" y="54" fill="#f87171" font-family="ui-monospace, monospace" font-size="13" font-weight="600">141 КБ в куче</text>
      
      <!-- JsonPopulator -->
      <text x="480" y="30" fill="#ffffff" font-family="ui-monospace, monospace" font-size="15" font-weight="700">1,46 мс</text>
      <text x="480" y="54" fill="#34d399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">0 B в куче (FastList)</text>
      
      <!-- Result -->
      <text x="700" y="30" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">на 23% быстрее</text>
      <text x="700" y="54" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">0 B аллокаций (-141 КБ)</text>
    </g>

  </g>
</svg>