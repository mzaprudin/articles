    <text x="290" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">SYSTEM.TEXT.JSON</text>
    <text x="490" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">JSONPOPULATOR</text>
    <text x="690" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">УСКОРЕНИЕ</text>
    <text x="810" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">ПАМЯТЬ</text>

    <!-- Row 1: Trade -->
    <rect x="0" y="48" width="896" height="64" rx="6" fill="#141e33" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="76" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Сделка Trade</text>
    <text x="20" y="98" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">156 байт UTF-8, 7 полей</text>
    
    <text x="290" y="86" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="14">521 нс <tspan fill="#64748b">(120 B)</tspan></text>
    
    <text x="490" y="86" fill="#34d399" font-family="ui-monospace, monospace" font-size="15" font-weight="700">430 нс <tspan fill="#10b981">(0 B)</tspan></text>
    
    <rect x="686" y="66" width="96" height="28" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="734" y="85" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">+21%</text>
    
    <rect x="806" y="66" width="74" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1"/>
    <text x="843" y="85" fill="#34d399" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">0 B/op</text>

    <!-- Row 2: Contract -->
    <rect x="0" y="118" width="896" height="64" rx="6" fill="#13231c" stroke="#164e39" stroke-width="1.2"/>
    <text x="20" y="146" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Контракт Gate</text>
    <text x="20" y="168" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">1 312 байт UTF-8, 50 полей</text>
    
    <text x="290" y="156" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="14">2,48 мкс <tspan fill="#64748b">(208 B)</tspan></text>
    
    <text x="490" y="156" fill="#34d399" font-family="ui-monospace, monospace" font-size="15" font-weight="700">1,85 мкс <tspan fill="#10b981">(0 B)</tspan></text>
    
    <rect x="686" y="136" width="96" height="28" rx="6" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
    <text x="734" y="155" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">+34%</text>
    
    <rect x="806" y="136" width="74" height="28" rx="6" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.2"/>
    <text x="843" y="155" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">0 B/op</text>

    <!-- Row 3: Array 592 -->
    <rect x="0" y="188" width="896" height="64" rx="6" fill="#141e33" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="216" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Массив контрактов</text>
    <text x="20" y="238" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">592 записи, ~1 МБ JSON</text>
    
    <text x="290" y="226" fill="#f87171" font-family="ui-monospace, monospace" font-size="14">1,80 мс <tspan fill="#ef4444">(141 КБ)</tspan></text>
    
    <text x="490" y="226" fill="#34d399" font-family="ui-monospace, monospace" font-size="15" font-weight="700">1,46 мс <tspan fill="#10b981">(0 B)</tspan></text>
    
    <rect x="686" y="206" width="96" height="28" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="734" y="225" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">+23%</text>
    
    <rect x="806" y="206" width="74" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1"/>
    <text x="843" y="225" fill="#34d399" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">0 B</text>
  </g>

  <!-- Footer Info -->
  <g transform="translate(32, 355)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Условия: цельный UTF-8 буфер, прогретый интернер строк, переиспользование экземпляров объектов и коллекций FastList.</text>
  </g>
</svg>