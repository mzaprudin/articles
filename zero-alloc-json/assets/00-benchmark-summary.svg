<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Сравнение производительности: System.Text.Json vs JsonPopulator</title>
  <desc id="desc">Сравнение времени разбора и аллокаций памяти в куче между System.Text.Json и JsonPopulator.</desc>

  <!-- Background -->
  <rect width="960" height="260" rx="10" fill="#0f172a"/>
  <rect width="960" height="260" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Title -->
  <text x="32" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Сравнение производительности: System.Text.Json против JsonPopulator</text>

  <!-- Table Container -->
  <g transform="translate(32, 58)">
    <!-- Header Row -->
    <rect x="0" y="0" width="896" height="36" rx="6" fill="#1e293b"/>
    <text x="20" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">СЦЕНАРИЙ</text>
    <text x="270" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">SYSTEM.TEXT.JSON</text>
    <text x="490" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">JSONPOPULATOR</text>
    <text x="710" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">РЕЗУЛЬТАТ</text>

    <!-- Row 1: Trade -->
    <rect x="0" y="42" width="896" height="46" rx="6" fill="#141e33" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="70" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Сделка (Trade, 156 B)</text>
    <text x="270" y="70" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="14">521 нс <tspan fill="#64748b">(120 B)</tspan></text>
    <text x="490" y="70" fill="#f1f5f9" font-family="ui-monospace, monospace" font-size="14" font-weight="600">430 нс <tspan fill="#34d399">(0 B)</tspan></text>
    <text x="710" y="70" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">на 21% быстрее <tspan fill="#34d399">/ 0 B/op</tspan></text>

    <!-- Row 2: Contract -->
    <rect x="0" y="94" width="896" height="46" rx="6" fill="#141e33" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="122" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Контракт (Gate, 1,3 KB)</text>
    <text x="270" y="122" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="14">2,48 мкс <tspan fill="#64748b">(208 B)</tspan></text>
    <text x="490" y="122" fill="#f1f5f9" font-family="ui-monospace, monospace" font-size="14" font-weight="600">1,85 мкс <tspan fill="#34d399">(0 B)</tspan></text>
    <text x="710" y="122" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">на 34% быстрее <tspan fill="#34d399">/ 0 B/op</tspan></text>

    <!-- Row 3: Array -->
    <rect x="0" y="146" width="896" height="46" rx="6" fill="#141e33" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="174" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Массив 592 контрактов (~1 MB)</text>
    <text x="270" y="174" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="14">1,80 мс <tspan fill="#64748b">(141 КБ)</tspan></text>
    <text x="490" y="174" fill="#f1f5f9" font-family="ui-monospace, monospace" font-size="14" font-weight="600">1,46 мс <tspan fill="#34d399">(0 B)</tspan></text>
    <text x="710" y="174" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">на 23% быстрее <tspan fill="#34d399">/ 0 B</tspan></text>
  </g>
</svg>