<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Сводные результаты бенчмарков: System.Text.Json против JsonPopulator</title>
  <desc id="desc">Сравнение скорости и аллокаций памяти в куче между System.Text.Json и JsonPopulator на .NET 10.</desc>

  <!-- Background -->
  <rect width="960" height="380" rx="12" fill="#0f172a"/>
  <rect width="960" height="380" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Container -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">BENCHMARKDOTNET v0.15.8 • .NET 10.0.14 • AMD RYZEN 9 5950X (LINUX)</text>
    <text x="0" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Сравнение производительности: System.Text.Json vs JsonPopulator</text>
  </g>

  <!-- Table Container -->
  <g transform="translate(32, 90)">
