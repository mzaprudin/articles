<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Анатомия аллокаций памяти в 64-битной куче .NET</title>
  <desc id="desc">Раскладка памяти объекта Trade (80 байт) и строки Symbol (40 байт), объясняющая ступени аллокаций в бенчмарках: 120 B, 40 B и 0 B на сообщение.</desc>

  <defs>
    <marker id="ptr-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="14" fill="#0f172a"/>

  <!-- Top Title Bar -->
  <text x="36" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.3">АНАТОМИЯ АЛЛОКАЦИЙ В 64-БИТНОЙ КУЧЕ: 120 B -&gt; 40 B -&gt; 0 B</text>

  <!-- Object 1: Trade (80 Bytes) -->
  <g transform="translate(36, 54)">
    <rect width="470" height="254" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="470" height="34" rx="10" fill="#0c4a6e"/>
    <text x="16" y="23" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">ОБЪЕКТ Trade В КУЧЕ (ИТОГО: 80 БАЙТ)</text>

    <!-- Fields Table -->
    <g transform="translate(14, 42)" font-family="ui-monospace, monospace" font-size="13">
      <!-- Row 1 -->
      <rect x="0" y="0" width="216" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="8" y="20" fill="#cbd5e1">Object Header: <tspan fill="#38bdf8" font-weight="700">8B</tspan></text>

      <rect x="226" y="0" width="216" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="234" y="20" fill="#cbd5e1">MethodTable: <tspan fill="#38bdf8" font-weight="700">8B</tspan></text>

      <!-- Row 2 -->
      <rect x="0" y="36" width="216" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="8" y="56" fill="#ffffff">Id (long): <tspan fill="#38bdf8" font-weight="700">8B</tspan></text>

      <rect x="226" y="36" width="216" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="234" y="56" fill="#ffffff">Price (double): <tspan fill="#38bdf8" font-weight="700">8B</tspan></text>

      <!-- Row 3 -->
      <rect x="0" y="72" width="216" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="8" y="92" fill="#ffffff">Amount (dec): <tspan fill="#38bdf8" font-weight="700">16B</tspan></text>

      <rect x="226" y="72" width="216" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="234" y="92" fill="#ffffff">Timestamp: <tspan fill="#38bdf8" font-weight="700">8B</tspan></text>

      <!-- Row 4 -->
      <rect x="0" y="108" width="216" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="8" y="128" fill="#ffffff">CreatedAt: <tspan fill="#38bdf8" font-weight="700">8B</tspan></text>

      <rect x="226" y="108" width="216" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="234" y="128" fill="#ffffff">IsBuyerMaker (bool): <tspan fill="#38bdf8" font-weight="700">8B</tspan></text>

      <!-- Row 5: Reference -->
      <rect x="0" y="144" width="442" height="48" rx="6" fill="#132e42" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="12" y="166" fill="#7dd3fc" font-size="13.5" font-weight="700">Symbol (ссылка на string в куче): 8B</text>
      <text x="12" y="184" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Указатель на объект строки в управляемой куче</text>
    </g>
  </g>

  <!-- Pointer Arrow -->
  <path d="M 506 262 L 540 262" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ptr-arrow)"/>

  <!-- Object 2: String "BTCUSDT" (40 Bytes) -->
  <g transform="translate(546, 54)">
    <rect width="378" height="254" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="378" height="34" rx="10" fill="#451a03"/>
    <text x="16" y="23" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">СТРОКА "BTCUSDT" В КУЧЕ (40 БАЙТ)</text>

    <!-- String Layout Table -->
    <g transform="translate(14, 42)" font-family="ui-monospace, monospace" font-size="13">
      <rect x="0" y="0" width="350" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="20" fill="#cbd5e1">Object Header: <tspan fill="#f59e0b" font-weight="700">8B</tspan></text>

      <rect x="0" y="36" width="350" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="56" fill="#cbd5e1">MethodTable (MT): <tspan fill="#f59e0b" font-weight="700">8B</tspan></text>

      <rect x="0" y="72" width="350" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="92" fill="#ffffff">Length (int32): <tspan fill="#f59e0b" font-weight="700">4B</tspan> (значение: 7)</text>

      <rect x="0" y="108" width="350" height="42" rx="4" fill="#2d1f08" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="12" y="127" fill="#fde68a" font-weight="700">UTF-16: 14B + null: 2B (итого 16B)</text>
      <text x="12" y="143" fill="#ffffff">'B','T','C','U','S','D','T','\0'</text>

      <rect x="0" y="156" width="350" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="176" fill="#cbd5e1">Alignment Padding: <tspan fill="#f59e0b" font-weight="700">4B</tspan></text>
    </g>
  </g>

  <!-- Bottom Comparison: 3 States -->
  <g transform="translate(36, 326)">
    <rect width="888" height="136" rx="10" fill="#131c2e" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="26" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">РЕЗЮМЕ БЕНЧМАРКОВ ПАМЯТИ:</text>

    <g transform="translate(16, 38)">
      <!-- Box 1: STJ -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="274" height="82" rx="6" fill="#2d1519" stroke="#ef4444" stroke-width="1.2"/>
        <text x="14" y="24" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">1. System.Text.Json</text>
        <text x="14" y="48" fill="#f87171" font-family="ui-monospace, monospace" font-size="16" font-weight="700">120 B / сообщ</text>
        <text x="14" y="68" fill="#fecaca" font-family="-apple-system, sans-serif" font-size="12">Trade (80 B) + строка (40 B)</text>
      </g>

      <!-- Box 2: Populator Reused -->
      <g transform="translate(291, 0)">
        <rect x="0" y="0" width="274" height="82" rx="6" fill="#291e0a" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="14" y="24" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">2. Populator (повторно)</text>
        <text x="14" y="48" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="16" font-weight="700">40 B / сообщ</text>
        <text x="14" y="68" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="12">Trade мутирован + строка (40 B)</text>
      </g>

      <!-- Box 3: Populator + Interner -->
      <g transform="translate(582, 0)">
        <rect x="0" y="0" width="274" height="82" rx="6" fill="#062e22" stroke="#10b981" stroke-width="1.5"/>
        <text x="14" y="24" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">3. Populator + Interner</text>
        <text x="14" y="48" fill="#34d399" font-family="ui-monospace, monospace" font-size="16" font-weight="700">0 B / сообщ</text>
        <text x="14" y="68" fill="#ecfdf5" font-family="-apple-system, sans-serif" font-size="12">Trade мутирован + пул строк (0 B)</text>
      </g>
    </g>
  </g>
</svg>